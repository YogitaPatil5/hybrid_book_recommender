{% extends "base.html" %}
{% block title %}Error {{ status_code }} — BookMind{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="text-align:center">
    <div class="page-heading">
      <h1><i class="fa-solid fa-book-skull"></i> {{ status_code }}</h1>
      <p>{{ message }}</p>
    </div>
    <a href="{{ url_for('home') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to home</a>
    {% if request_id %}<p class="section-sub" style="margin-top:16px">Reference: <code>{{ request_id }}</code></p>{% endif %}
  </div>
</section>
{% endblock %}
